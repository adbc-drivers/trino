# Keep HTTP available for plain HTTP tests and authenticate HTTPS clients
# using certificates signed by the local test CA.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/certs/localhost.p12
http-server.https.keystore.key=trino-dev
http-server.https.truststore.path=/etc/trino/certs/ca.crt
http-server.authentication.type=CERTIFICATE,OAUTH2
http-server.authentication.certificate.user-mapping.pattern=CN=(.*)
# OAuth 2.0 against the oauth2 service in compose.yaml. The authorization URL
# is opened by the tests (the browser), the others are called by Trino.
http-server.authentication.oauth2.issuer=http://oauth2:8080/default
http-server.authentication.oauth2.oidc.discovery=false
http-server.authentication.oauth2.auth-url=http://localhost:8180/default/authorize
http-server.authentication.oauth2.token-url=http://oauth2:8080/default/token
http-server.authentication.oauth2.jwks-url=http://oauth2:8080/default/jwks
http-server.authentication.oauth2.client-id=trino
http-server.authentication.oauth2.client-secret=trino-local-validation-oauth2-secret
http-server.authentication.allow-insecure-over-http=true
internal-communication.shared-secret=trino-local-validation-shared-secret-for-certificate-authentication
discovery.uri=http://localhost:8080
