name: trino
services:
  # Work around https://github.com/docker/compose/issues/10596
  test-service:
    image: alpine:latest
    command: ["sleep", "infinity"]
    depends_on:
      trino:
        condition: service_healthy
      trino-init:
        condition: service_completed_successfully

  cert-generator:
    image: alpine:latest
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache openssl >/dev/null
        /bin/sh /work/certs/generate-certs.sh
    volumes:
      - "./ci/docker/certs:/work/certs"

  # OpenID Connect provider for Trino's OAuth 2.0 (external) authentication.
  # It logs in without a login page, always as the user "oauth-user". Trino
  # calls it as oauth2:8080 and the tests' browser as localhost:8180; tokens
  # carry the issuer of the token endpoint, which only Trino calls.
  oauth2:
    image: ghcr.io/navikt/mock-oauth2-server:6.1.3
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG: >-
        {"interactiveLogin": false, "tokenCallbacks": [{"issuerId": "default",
        "tokenExpiry": 3600, "requestMappings": [{"requestParam": "grant_type",
        "match": "*", "claims": {"sub": "oauth-user", "aud": ["trino"]}}]}]}
    ports:
      - 8180:8080

  trino:
    image: trinodb/trino:latest
    environment:
      TRINO_NODE_ENVIRONMENT: development
    depends_on:
      cert-generator:
        condition: service_completed_successfully
      oauth2:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "/usr/lib/trino/bin/health-check"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - 8080:8080
      - 8443:8443
    volumes:
      - "./ci/docker/trino/config.properties:/etc/trino/config.properties:ro"
      - "./ci/docker/trino/access-control.properties:/etc/trino/access-control.properties:ro"
      - "./ci/docker/certs:/etc/trino/certs:ro"
      # Add a second 'memory' catalog named 'secondmemory'
      - "./ci/docker/catalog/secondmemory.properties:/etc/trino/catalog/secondmemory.properties:ro"

  trino-init:
    image: trinodb/trino:latest
    entrypoint: ["/bin/bash", "/init/bootstrap.sh"]
    depends_on:
      trino:
        condition: service_healthy
    volumes:
      - "./ci/docker/init:/init:ro"
